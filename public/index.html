<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Filter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-active { background-color: #2563eb; color: white; }
        .tab-inactive { background-color: transparent; color: #475569; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
    </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">
    <main class="max-w-2xl mx-auto space-y-6">
        
        <header class="text-center space-y-2 mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight">
                Corporate Filter
            </h1>
            <p class="text-slate-500 text-sm md:text-base">
                Ngetik pas lagi emosi? Sini difilter dulu biar karir tetep aman.
            </p>
        </header>

        <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="space-y-2">
                <label for="rawInput" class="block text-sm font-semibold text-slate-700">Uneg-uneg kamu:</label>
                <textarea id="rawInput" rows="4" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition resize-none text-slate-700 placeholder-slate-400" placeholder="Contoh: Lah ini kan harusnya kerjaan elu, ngapain nyuruh gue? Udah deadline lagi!"></textarea>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700">Pesan ini ditujukan ke siapa?</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer relative">
                        <input type="radio" name="targetAudience" value="atasan" class="peer sr-only" checked>
                        <div class="rounded-xl border border-slate-200 bg-white p-3 text-center hover:bg-slate-50 peer-checked:border-blue-500 peer-checked:bg-blue-50 peer-checked:text-blue-700 transition">
                            <i data-feather="briefcase" class="mx-auto mb-1 w-5 h-5"></i>
                            <span class="text-sm font-medium">Atasan / Klien</span>
                            <p class="text-[10px] text-slate-500 mt-0.5">(Formal & Diplomatis)</p>
                        </div>
                    </label>
                    <label class="cursor-pointer relative">
                        <input type="radio" name="targetAudience" value="teman" class="peer sr-only">
                        <div class="rounded-xl border border-slate-200 bg-white p-3 text-center hover:bg-slate-50 peer-checked:border-blue-500 peer-checked:bg-blue-50 peer-checked:text-blue-700 transition">
                            <i data-feather="users" class="mx-auto mb-1 w-5 h-5"></i>
                            <span class="text-sm font-medium">Teman / Satu Tim</span>
                            <p class="text-[10px] text-slate-500 mt-0.5">(Kasual & Santai)</p>
                        </div>
                    </label>
                </div>
            </div>

            <button id="generateBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition focus:ring-4 focus:ring-slate-200">
                <i data-feather="loader" id="loadingIcon" class="hidden animate-spin w-5 h-5"></i>
                <i data-feather="magic-wand" id="magicIcon" class="w-5 h-5"></i>
                <span id="btnText">Poles Bahasanya!</span>
            </button>
        </div>

        <div id="outputSection" class="hidden space-y-5">
            <div class="flex justify-center mb-2">
                <div class="bg-slate-200/60 p-1 rounded-xl flex gap-1">
                    <button id="tabID" class="px-4 py-2 text-sm font-semibold rounded-lg tab-active transition" onclick="switchLang('indonesia')">🇮🇩 Indonesia</button>
                    <button id="tabEN" class="px-4 py-2 text-sm font-semibold rounded-lg tab-inactive transition hover:text-slate-700" onclick="switchLang('en')">🇬🇧 English</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-2" id="optionSelector">
                <button onclick="selectOption(1)" id="btnOpt1" class="p-3 rounded-xl border text-left transition-all border-blue-500 bg-blue-50">
                    <div class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">Opsi 1</div>
                    <div class="text-sm font-semibold text-slate-800" id="opt1Title">Asertif & Langsung</div>
                </button>
                <button onclick="selectOption(2)" id="btnOpt2" class="p-3 rounded-xl border text-left transition-all border-slate-200 bg-white hover:bg-slate-50 text-slate-500 hover:text-slate-800">
                    <div class="text-xs font-bold uppercase tracking-wider mb-1">Opsi 2</div>
                    <div class="text-sm font-semibold" id="opt2Title">Diplomatis & Netral</div>
                </button>
                <button onclick="selectOption(3)" id="btnOpt3" class="p-3 rounded-xl border text-left transition-all border-slate-200 bg-white hover:bg-slate-50 text-slate-500 hover:text-slate-800">
                    <div class="text-xs font-bold uppercase tracking-wider mb-1">Opsi 3</div>
                    <div class="text-sm font-semibold" id="opt3Title">Sangat Halus</div>
                </button>
            </div>

            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200 relative">
                <button onclick="copyText('resultText')" class="absolute top-4 right-4 text-slate-400 hover:text-blue-600 transition bg-slate-50 p-2 rounded-lg" title="Copy Text">
                    <i data-feather="copy" class="w-5 h-5"></i>
                </button>
                <p id="resultText" class="text-slate-800 leading-relaxed text-base md:text-lg pr-8 min-h-[4rem]"></p>
            </div>

            <div class="bg-slate-900 text-white p-5 rounded-2xl shadow-md">
                <h3 class="text-sm font-bold text-yellow-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i data-feather="crosshair" class="w-4 h-4"></i> Analisis Taktik
                </h3>
                <p id="analysisText" class="text-slate-300 text-sm leading-relaxed"></p>
            </div>
        </div>
        
        <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
            Teks berhasil disalin!
        </div>

        <footer class="text-center text-slate-400 text-sm mt-12 pb-6">
            <i>Menyelamatkan karirmu sejak 2026 | &copy; Piarus</i>
        </footer>
    </main>

    <!-- Menyambungkan ke file JS terpisah -->
    <script src="script.js"></script>
</body>
</html>
